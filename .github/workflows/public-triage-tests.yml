name: Test public triage
on:
  pull_request:
    paths: ['public-triage/**', '.github/workflows/public-triage*.yml']
  push:
    branches: [main]
    paths: ['public-triage/**', '.github/workflows/public-triage*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test public-triage/triage.test.mjs
