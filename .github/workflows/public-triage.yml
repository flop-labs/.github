name: Public issue and PR triage

on:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply labels and issue closures
        type: boolean
        default: false

permissions: {}

concurrency:
  group: public-triage
  cancel-in-progress: false

jobs:
  triage:
    if: github.repository_owner == 'flop-labs' && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./public-triage
        with:
          apply: ${{ github.event_name == 'schedule' || inputs.apply }}
          jev-key: ${{ secrets.TYPESAFE_API_KEY }}
